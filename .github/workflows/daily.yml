name: Daily job digest
on:
  schedule:
    - cron: "30 3 * * *"   # 9:00 AM IST every day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python job_finder.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      - name: Save seen jobs
        run: |
          git config user.name "job-bot"; git config user.email "bot@users.noreply.github.com"
          git add seen.json; git commit -m "update seen jobs" || true; git push
